<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анкета о сервисе</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background: #000;
        color: #e8e8e8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        padding: 40px 20px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    .container {
        position: relative;
        max-width: 640px;
        width: 100%;
        background: #0a0a0a;
        border-radius: 18px;
        padding: 40px 32px;
        overflow: hidden;
        box-shadow: 0 0 80px rgba(255,255,255,0.04);
    }

    .container::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 18px;
        padding: 1px;
        background: linear-gradient(130deg, #1a1a1a 0%, #1a1a1a 40%, rgba(255,255,255,0.7) 50%, #1a1a1a 60%, #1a1a1a 100%);
        background-size: 300% 300%;
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
                mask-composite: exclude;
        animation: borderShimmer 5s linear infinite;
        pointer-events: none;
    }

    @keyframes borderShimmer {
        0%   { background-position: 100% 0; }
        100% { background-position: -100% 0; }
    }

    .logo-wrap { text-align: center; margin-bottom: 24px; }

    .logo {
        max-width: 200px;
        width: 100%;
        height: auto;
        display: inline-block;
        opacity: 0.95;
        filter: drop-shadow(0 0 24px rgba(255,255,255,0.12));
        transition: opacity 0.3s, filter 0.3s;
    }

    .logo:hover { opacity: 1; filter: drop-shadow(0 0 30px rgba(255,255,255,0.3)); }

    h1 {
        position: relative;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-align: center;
        margin-bottom: 8px;
        background: linear-gradient(100deg, #ffffff 0%, #ffffff 40%, #888888 50%, #ffffff 60%, #ffffff 100%);
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        animation: textShimmer 4s linear infinite;
    }

    @keyframes textShimmer {
        0%   { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }

    .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 8px; }

    .scale-hint {
        text-align: center;
        color: #666;
        font-size: 13px;
        margin-bottom: 32px;
        padding-bottom: 24px;
        border-bottom: 1px solid #1a1a1a;
    }

    .field { margin-bottom: 28px; }

    label.question {
        display: block;
        font-weight: 500;
        color: #dcdcdc;
        margin-bottom: 14px;
        font-size: 15px;
    }

    .field-hint { color: #777; font-size: 13px; line-height: 1.5; margin-bottom: 12px; }

    .required { color: #fff; margin-left: 4px; font-weight: 700; }

    input[type="text"], input[type="tel"], textarea {
        width: 100%;
        background: #111;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        color: #fff;
        padding: 14px 16px;
        font-size: 15px;
        font-family: inherit;
        transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        outline: none;
    }

    input[type="text"]:focus, input[type="tel"]:focus, textarea:focus {
        border-color: #666;
        background: #161616;
        box-shadow: 0 0 0 3px rgba(255,255,255,0.06), 0 0 24px rgba(255,255,255,0.08);
    }

    input::placeholder { color: #555; }

    textarea { min-height: 100px; resize: vertical; }

    .rating { display: flex; gap: 10px; flex-wrap: wrap; }
    .rating input[type="radio"] { display: none; }

    .rating label {
        position: relative;
        flex: 1;
        min-width: 52px;
        text-align: center;
        padding: 12px 0;
        background: #111;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        cursor: pointer;
        color: #999;
        font-weight: 600;
        font-size: 15px;
        transition: all 0.25s ease;
        user-select: none;
        overflow: hidden;
    }

    .rating label::after {
        content: "";
        position: absolute;
        top: 0; left: -80%;
        width: 50%; height: 100%;
        background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
        transform: skewX(-20deg);
        pointer-events: none;
    }

    .rating label:hover::after { animation: tileShimmer 0.9s ease; }

    @keyframes tileShimmer {
        0%   { left: -80%; }
        100% { left: 130%; }
    }

    .rating label:hover { border-color: #666; color: #eee; background: #161616; }

    .rating input[type="radio"]:checked + label {
        background: #fff;
        color: #000;
        border-color: #fff;
        box-shadow: 0 0 28px rgba(255,255,255,0.35);
    }

    .submit-wrap { margin-top: 36px; text-align: center; }

    button.shimmer {
        position: relative;
        display: inline-block;
        width: 100%;
        padding: 18px 32px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #000;
        background: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        overflow: hidden;
        transition: transform 0.2s, box-shadow 0.3s;
        font-family: inherit;
    }

    button.shimmer::before {
        content: "";
        position: absolute;
        top: 0; left: -75%;
        width: 55%; height: 100%;
        background: linear-gradient(120deg, transparent 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.35) 50%, rgba(0,0,0,0.0) 70%, transparent 100%);
        transform: skewX(-20deg);
        animation: shimmer 2.4s infinite;
    }

    button.shimmer::after {
        content: "";
        position: absolute;
        top: 0; left: -100%;
        width: 40%; height: 100%;
        background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.9) 50%, transparent 100%);
        transform: skewX(-20deg);
        animation: shimmerLight 2.4s infinite;
        animation-delay: 0.35s;
        pointer-events: none;
    }

    button.shimmer:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 40px rgba(255,255,255,0.4), 0 0 80px rgba(255,255,255,0.15);
    }

    button.shimmer:active { transform: translateY(0); }
    button.shimmer:disabled { opacity: 0.6; cursor: not-allowed; }

    @keyframes shimmer {
        0%   { left: -75%; }
        60%  { left: 125%; }
        100% { left: 125%; }
    }

    @keyframes shimmerLight {
        0%   { left: -100%; }
        60%  { left: 140%; }
        100% { left: 140%; }
    }

    @media (max-width: 520px) {
        .container { padding: 28px 20px; }
        h1 { font-size: 21px; }
        .logo { max-width: 160px; }
        .rating label { min-width: 44px; font-size: 14px; padding: 10px 0; }
    }
</style>
</head>
<body>

<div class="container">

    <div class="logo-wrap">
        <img src="logo.png" alt="Логотип компании" class="logo">
    </div>

    <h1>Ваш взгляд на сотрудничество</h1>
    <p class="subtitle">Сервис и торговые представители</p>
    <p class="scale-hint">
        Анкета займёт 2–3 минуты.<br>
        Оценка: 1 — очень плохо, 5 — отлично.
    </p>

    <form id="surveyForm">

        <div class="field">
            <label class="question" for="company">Наименование вашей организации<span class="required">*</span></label>
            <input type="text" id="company" name="Организация" required>
        </div>

        <div class="field">
            <label class="question">1. Насколько в целом вы удовлетворены сервисом нашей компании?</label>
            <div class="rating">
                <input type="radio" id="q1_1" name="Вопрос 1" value="1" required><label for="q1_1">1</label>
                <input type="radio" id="q1_2" name="Вопрос 1" value="2"><label for="q1_2">2</label>
                <input type="radio" id="q1_3" name="Вопрос 1" value="3"><label for="q1_3">3</label>
                <input type="radio" id="q1_4" name="Вопрос 1" value="4"><label for="q1_4">4</label>
                <input type="radio" id="q1_5" name="Вопрос 1" value="5"><label for="q1_5">5</label>
            </div>
        </div>

        <div class="field">
            <label class="question">2. Насколько работа вашего торгового представителя соответствует вашим ожиданиям?</label>
            <div class="rating">
                <input type="radio" id="q2_1" name="Вопрос 2" value="1" required><label for="q2_1">1</label>
                <input type="radio" id="q2_2" name="Вопрос 2" value="2"><label for="q2_2">2</label>
                <input type="radio" id="q2_3" name="Вопрос 2" value="3"><label for="q2_3">3</label>
                <input type="radio" id="q2_4" name="Вопрос 2" value="4"><label for="q2_4">4</label>
                <input type="radio" id="q2_5" name="Вопрос 2" value="5"><label for="q2_5">5</label>
            </div>
        </div>

        <div class="field">
            <label class="question">3. Насколько торговый представитель доступен и оперативен, когда у вас появляется запрос?</label>
            <div class="rating">
                <input type="radio" id="q3_1" name="Вопрос 3" value="1" required><label for="q3_1">1</label>
                <input type="radio" id="q3_2" name="Вопрос 3" value="2"><label for="q3_2">2</label>
                <input type="radio" id="q3_3" name="Вопрос 3" value="3"><label for="q3_3">3</label>
                <input type="radio" id="q3_4" name="Вопрос 3" value="4"><label for="q3_4">4</label>
                <input type="radio" id="q3_5" name="Вопрос 3" value="5"><label for="q3_5">5</label>
            </div>
        </div>

        <div class="field">
            <label class="question">4. Насколько компетентно торговый представитель помогает вам с выбором ассортимента?</label>
            <div class="rating">
                <input type="radio" id="q4_1" name="Вопрос 4" value="1" required><label for="q4_1">1</label>
                <input type="radio" id="q4_2" name="Вопрос 4" value="2"><label for="q4_2">2</label>
                <input type="radio" id="q4_3" name="Вопрос 4" value="3"><label for="q4_3">3</label>
                <input type="radio" id="q4_4" name="Вопрос 4" value="4"><label for="q4_4">4</label>
                <input type="radio" id="q4_5" name="Вопрос 4" value="5"><label for="q4_5">5</label>
            </div>
        </div>

        <div class="field">
            <label class="question">5. Насколько своевременно торговый представитель информирует вас о новинках, акциях и специальных условиях?</label>
            <div class="rating">
                <input type="radio" id="q5_1" name="Вопрос 5" value="1" required><label for="q5_1">1</label>
                <input type="radio" id="q5_2" name="Вопрос 5" value="2"><label for="q5_2">2</label>
                <input type="radio" id="q5_3" name="Вопрос 5" value="3"><label for="q5_3">3</label>
                <input type="radio" id="q5_4" name="Вопрос 5" value="4"><label for="q5_4">4</label>
                <input type="radio" id="q5_5" name="Вопрос 5" value="5"><label for="q5_5">5</label>
            </div>
        </div>

        <div class="field">
            <label class="question">6. Насколько удобно вам взаимодействовать с нами по вопросам заказа и доставки?</label>
            <div class="rating">
                <input type="radio" id="q6_1" name="Вопрос 6" value="1" required><label for="q6_1">1</label>
                <input type="radio" id="q6_2" name="Вопрос 6" value="2"><label for="q6_2">2</label>
                <input type="radio" id="q6_3" name="Вопрос 6" value="3"><label for="q6_3">3</label>
                <input type="radio" id="q6_4" name="Вопрос 6" value="4"><label for="q6_4">4</label>
                <input type="radio" id="q6_5" name="Вопрос 6" value="5"><label for="q6_5">5</label>
            </div>
        </div>

        <div class="field">
            <label class="question">7. Насколько сроки доставки соответствуют вашим ожиданиям?</label>
            <div class="rating">
                <input type="radio" id="q7_1" name="Вопрос 7" value="1" required><label for="q7_1">1</label>
                <input type="radio" id="q7_2" name="Вопрос 7" value="2"><label for="q7_2">2</label>
                <input type="radio" id="q7_3" name="Вопрос 7" value="3"><label for="q7_3">3</label>
                <input type="radio" id="q7_4" name="Вопрос 7" value="4"><label for="q7_4">4</label>
                <input type="radio" id="q7_5" name="Вопрос 7" value="5"><label for="q7_5">5</label>
            </div>
        </div>

        <div class="field">
            <label class="question">8. Насколько наше сотрудничество в целом оправдывает ваши ожидания?</label>
            <div class="rating">
                <input type="radio" id="q8_1" name="Вопрос 8" value="1" required><label for="q8_1">1</label>
                <input type="radio" id="q8_2" name="Вопрос 8" value="2"><label for="q8_2">2</label>
                <input type="radio" id="q8_3" name="Вопрос 8" value="3"><label for="q8_3">3</label>
                <input type="radio" id="q8_4" name="Вопрос 8" value="4"><label for="q8_4">4</label>
                <input type="radio" id="q8_5" name="Вопрос 8" value="5"><label for="q8_5">5</label>
            </div>
        </div>

        <div class="field">
            <label class="question" for="q9">9. Что для вас наиболее ценно в работе наших торговых представителей?</label>
            <textarea id="q9" name="Вопрос 9"></textarea>
        </div>

        <div class="field">
            <label class="question" for="q10">10. Что мы можем сделать, чтобы сервис в целом, включая работу торговых представителей и доставку, стал для вас ещё удобнее?</label>
            <textarea id="q10" name="Вопрос 10"></textarea>
        </div>

        <div class="field">
            <label class="question" for="phone">Номер телефона</label>
            <p class="field-hint">Если хотите, чтобы мы вам перезвонили — оставьте номер, и мы свяжемся в удобное для вас время.</p>
            <input type="tel" id="phone" name="Телефон" placeholder="+7 (___) ___-__-__" maxlength="18" inputmode="numeric" autocomplete="tel">
        </div>

        <div class="submit-wrap">
            <button type="submit" class="shimmer" id="submitBtn">Отправить</button>
        </div>

    </form>
</div>

<script>
// ==== НАСТРОЙКИ ВКОНТАКТЕ ====
var VK_TOKEN   = 'vk1.a.g8PDU4wPVWvtNKAsoSPVzf0fvd4I_wCuNbOSlrmm-dkw_WAx7Pk8xkxM2PiXEqROz0HNBa1eGuMQdHJV8DyYIgOvyr6puqoFDHiwhl_M_pq8aIxcCNmq2w41OBCFzAde6JcohhERHbd5Zmy3P2p-HkUrXCxW_zmN8HKu6taXbkDF5v4l6Z0bL3rjKrv3PVvUYs9o5YZH2v3A8V3BsGFSfA';
var VK_USER_ID = '513391846';
// =============================

// Полные тексты вопросов (для расшифровки в сообщении)
var QUESTIONS = {
    'Вопрос 1': 'Насколько в целом вы удовлетворены сервисом нашей компании?',
    'Вопрос 2': 'Насколько работа вашего торгового представителя соответствует вашим ожиданиям?',
    'Вопрос 3': 'Насколько торговый представитель доступен и оперативен, когда у вас появляется запрос?',
    'Вопрос 4': 'Насколько компетентно торговый представитель помогает вам с выбором ассортимента?',
    'Вопрос 5': 'Насколько своевременно торговый представитель информирует вас о новинках, акциях и специальных условиях?',
    'Вопрос 6': 'Насколько удобно вам взаимодействовать с нами по вопросам заказа и доставки?',
    'Вопрос 7': 'Насколько сроки доставки соответствуют вашим ожиданиям?',
    'Вопрос 8': 'Насколько наше сотрудничество в целом оправдывает ваши ожидания?',
    'Вопрос 9': 'Что для вас наиболее ценно в работе наших торговых представителей?',
    'Вопрос 10': 'Что мы можем сделать, чтобы сервис в целом, включая работу торговых представителей и доставку, стал для вас ещё удобнее?'
};

// Расшифровка оценок
var RATING_LABELS = {
    '1': 'Очень плохо',
    '2': 'Плохо',
    '3': 'Удовлетворительно',
    '4': 'Хорошо',
    '5': 'Отлично'
};

// Автоформат телефона
(function () {
    var input = document.getElementById('phone');
    if (!input) return;

    input.addEventListener('focus', function () {
        if (!input.value) input.value = '+7 ';
    });
    input.addEventListener('blur', function () {
        if (input.value === '+7 ' || input.value === '+7') input.value = '';
    });
    input.addEventListener('input', function () {
        var digits = input.value.replace(/\D/g, '');
        if (digits.startsWith('8')) digits = '7' + digits.slice(1);
        if (digits && !digits.startsWith('7')) digits = '7' + digits;
        digits = digits.slice(0, 11);
        var f = '+7';
        if (digits.length > 1) f += ' (' + digits.slice(1, 4);
        if (digits.length >= 5) f += ') ' + digits.slice(4, 7);
        if (digits.length >= 8) f += '-' + digits.slice(7, 9);
        if (digits.length >= 10) f += '-' + digits.slice(9, 11);
        input.value = f;
    });
})();

// Собираем красивое сообщение
function buildMessage(data) {
    var lines = [];
    lines.push('📋 Новая заявка с анкеты');
    lines.push('');

    if (data['Организация']) {
        lines.push('🏢 Организация: ' + data['Организация']);
        lines.push('');
    }

    // Оценки
    var ratingsBlock = [];
    for (var i = 1; i <= 8; i++) {
        var key = 'Вопрос ' + i;
        var val = data[key];
        if (!val) continue;
        ratingsBlock.push(i + '. ' + QUESTIONS[key]);
        ratingsBlock.push('    → ' + val + ' — ' + (RATING_LABELS[val] || ''));
        ratingsBlock.push('');
    }

    if (ratingsBlock.length) {
        lines.push('━━━━━━━━━━━━━━━━━━');
        lines.push('📊 Оценки');
        lines.push('');
        lines = lines.concat(ratingsBlock);
    }

    // Открытые ответы
    var textBlock = [];
    if (data['Вопрос 9'] && data['Вопрос 9'].trim()) {
        textBlock.push('9. ' + QUESTIONS['Вопрос 9']);
        textBlock.push('    → ' + data['Вопрос 9'].trim());
        textBlock.push('');
    }
    if (data['Вопрос 10'] && data['Вопрос 10'].trim()) {
        textBlock.push('10. ' + QUESTIONS['Вопрос 10']);
        textBlock.push('    → ' + data['Вопрос 10'].trim());
        textBlock.push('');
    }

    if (textBlock.length) {
        lines.push('━━━━━━━━━━━━━━━━━━');
        lines.push('💬 Комментарии');
        lines.push('');
        lines = lines.concat(textBlock);
    }

    // Телефон
    if (data['Телефон']) {
        lines.push('━━━━━━━━━━━━━━━━━━');
        lines.push('📞 Телефон: ' + data['Телефон']);
    }

    return lines.join('\n');
}

// Отправка формы в VK через JSONP
document.getElementById('surveyForm').addEventListener('submit', function (e) {
    e.preventDefault();

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Отправка...';

    var formData = new FormData(e.target);
    var data = {};
    for (var pair of formData.entries()) {
        data[pair[0]] = pair[1];
    }

    var text = buildMessage(data);

    var cbName = 'vkCallback_' + Math.floor(Math.random() * 1000000);
    var randomId = Math.floor(Math.random() * 1000000000);

    window[cbName] = function (resp) {
        if (resp && resp.response) {
            alert('Спасибо! Ваша заявка отправлена. Мы свяжемся с вами при необходимости.');
            document.getElementById('surveyForm').reset();
        } else {
            var err = resp && resp.error ? resp.error.error_msg : 'неизвестная ошибка';
            alert('Ошибка отправки: ' + err);
        }
        btn.disabled = false;
        btn.textContent = 'Отправить';
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
    };

    var script = document.createElement('script');
    script.src = 'https://api.vk.com/method/messages.send'
        + '?user_id=' + VK_USER_ID
        + '&message=' + encodeURIComponent(text)
        + '&random_id=' + randomId
        + '&access_token=' + VK_TOKEN
        + '&v=5.199'
        + '&callback=' + cbName;
    script.onerror = function () {
        alert('Ошибка соединения с VK. Попробуйте ещё раз.');
        btn.disabled = false;
        btn.textContent = 'Отправить';
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
    };
    document.body.appendChild(script);
});
</script>

</body>
</html>
